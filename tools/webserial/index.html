<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Web Serial 指令台</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 24px auto; padding: 0 12px; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; }
    #log { white-space: pre-wrap; border: 1px solid #ddd; border-radius: 8px; padding: 10px; min-height: 220px; }
  </style>
</head>
<body>
  <h2>ESP32 Web Serial 指令台</h2>
  <div class="row">
    <button id="btnConnect">连接串口</button>
    <button id="btnDisconnect" disabled>断开</button>
  </div>
  <div class="row">
    <input id="cmd" placeholder="例如：PING / STATE / ABORT / PUT /tmp/a.bin 100 0" />
    <button id="btnSend" disabled>发送</button>
  </div>
  <div id="log"></div>

  <script>
    let port;
    let reader;
    let writer;
    let reading = false;

    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const btnSend = document.getElementById('btnSend');
    const cmdInput = document.getElementById('cmd');
    const logEl = document.getElementById('log');

    function log(text) {
      const ts = new Date().toLocaleTimeString();
      logEl.textContent += `[${ts}] ${text}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function readLoop() {
      const decoder = new TextDecoder();
      let buffer = '';
      reading = true;

      while (reading && port?.readable) {
        reader = port.readable.getReader();
        try {
          while (reading) {
            const { value, done } = await reader.read();
            if (done) break;
            if (!value) continue;

            buffer += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buffer.indexOf('\n')) >= 0) {
              const line = buffer.slice(0, idx).trim();
              buffer = buffer.slice(idx + 1);
              if (line.length > 0) log(`<- ${line}`);
            }
          }
        } catch (err) {
          log(`读取异常: ${err.message}`);
        } finally {
          reader.releaseLock();
          reader = null;
        }
      }
    }

    async function connect() {
      if (!('serial' in navigator)) {
        alert('当前浏览器不支持 Web Serial，请使用 Chrome/Edge。');
        return;
      }

      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      writer = port.writable.getWriter();

      btnConnect.disabled = true;
      btnDisconnect.disabled = false;
      btnSend.disabled = false;
      log('串口已连接');
      readLoop();
    }

    async function disconnect() {
      reading = false;
      try { if (reader) await reader.cancel(); } catch {}
      try { if (writer) writer.releaseLock(); } catch {}
      writer = null;

      if (port) {
        try { await port.close(); } catch {}
      }
      port = null;

      btnConnect.disabled = false;
      btnDisconnect.disabled = true;
      btnSend.disabled = true;
      log('串口已断开');
    }

    async function sendCommand() {
      const cmd = cmdInput.value.trim();
      if (!cmd || !writer) return;
      const payload = `${cmd}\n`;
      await writer.write(new TextEncoder().encode(payload));
      log(`-> ${cmd}`);
      cmdInput.value = '';
      cmdInput.focus();
    }

    btnConnect.addEventListener('click', () => connect().catch(err => log(`连接失败: ${err.message}`)));
    btnDisconnect.addEventListener('click', () => disconnect().catch(err => log(`断开失败: ${err.message}`)));
    btnSend.addEventListener('click', () => sendCommand().catch(err => log(`发送失败: ${err.message}`)));
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendCommand().catch(err => log(`发送失败: ${err.message}`));
      }
    });
  </script>
</body>
</html>
